<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dr. Sedique's Daily News</title>

<style>
    body { margin:0; background:#050608; color:#e6e6e6; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header{background:#101218;border-bottom:1px solid #272b33;padding:20px;text-align:center;position:sticky;top:0;z-index:100;}
    h1{margin:0;font-size:28px;}
    #toolbar{margin-top:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
    #searchBar{flex:1 1 320px;max-width:600px;padding:10px 14px;border-radius:999px;border:1px solid #3a4250;background:#151822;color:#f0f0f0;font-size:15px;}
    .filter{background:#151822;border-radius:999px;border:1px solid #3a4250;padding:8px 14px;color:#d5d9e3;font-size:13px;cursor:pointer;}
    .filter.active{background:#2563eb;border-color:#2563eb;color:#fff;}
    #status{text-align:center;font-size:13px;color:#9ca3af;margin-top:6px;}
    main{padding:20px;}
    .columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;}
    .column{background:#0c0f16;border-radius:10px;border:1px solid #1e2532;padding:10px;}
    .column-header{padding:6px 4px 10px;margin-bottom:8px;border-bottom:1px solid #1e2532;}
    .column-title{text-transform:uppercase;font-size:14px;font-weight:600;}
    .card{background:#111827;border-radius:10px;border:1px solid #1f2937;margin:10px 0;overflow:hidden;}
    .card img{width:100%;height:150px;object-fit:cover;}
    .card-body{padding:10px;}
    .card-title a{text-decoration:none;color:#e5e7eb;font-size:15px;font-weight:600;}
    .card-desc{font-size:13px;color:#cbd5f5;margin-top:6px;}
</style>
</head>

<body>

<header>
<h1>📡 Dr. Sedique's Daily News</h1>
<div id="toolbar">
    <input id="searchBar" type="text" placeholder="Search across all sources...">
    <button class="filter active" data-source="all">All</button>
    <button class="filter" data-source="Reuters">Reuters</button>
    <button class="filter" data-source="AP News">AP News</button>
    <button class="filter" data-source="BBC">BBC</button>
    <button class="filter" data-source="Al Jazeera">Al Jazeera</button>
    <button class="filter" data-source="DW">DW</button>
    <button class="filter" data-source="MarketWatch">MarketWatch</button>
    <button class="filter" data-source="CNBC">CNBC</button>
</div>
<div id="status">Loading...</div>
</header>

<main>
<div class="columns" id="columns"></div>
</main>

<script>
// WORKING FEEDS
const feeds = [
    { name: "Reuters", url: "https://news.google.com/rss/search?q=Reuters+World&hl=en-US&gl=US&ceid=US:en" },
    { name: "AP News", url: "https://news.google.com/rss/search?q=Associated+Press+World&hl=en-US&gl=US&ceid=US:en" },
    { name: "BBC", url: "https://feeds.bbci.co.uk/news/world/rss.xml" },
    { name: "Al Jazeera", url: "https://www.aljazeera.com/xml/rss/all.xml" },
    { name: "DW", url: "https://rss.dw.com/xml/rss-en-world" },
    { name: "MarketWatch", url: "https://feeds.marketwatch.com/marketwatch/topstories" },
    { name: "CNBC", url: "https://www.cnbc.com/id/100003114/device/rss/rss.html" }
];

function sanitize(t){return t?t.replace(/(<([^>]+)>)/gi,""):'';}

// UNIVERSAL IMAGE EXTRACTOR
function extractImage(item){
    // 1. <media:content> or <media:thumbnail>
    const media = item.querySelector("media\\:content, media\\:thumbnail");
    if (media?.getAttribute("url")) return media.getAttribute("url");

    // 2. <enclosure url="">
    const enc = item.querySelector("enclosure");
    if (enc?.getAttribute("url")) return enc.getAttribute("url");

    // 3. images inside description
    const desc = item.querySelector("description")?.textContent || "";
    let match = desc.match(/<img[^>]+src="([^">]+)"/i);
    if (match) return match[1];

    // 4. Atom <content> images
    const content = item.querySelector("content")?.textContent || "";
    match = content.match(/<img[^>]+src="([^">]+)"/i);
    if (match) return match[1];

    return null;
}

function initColumns(){
    const c=document.getElementById('columns');
    feeds.forEach(f=>{
        const key=f.name.replace(/\s+/g,'');
        const col=document.createElement('section');
        col.className="column";
        col.dataset.source=f.name;
        col.innerHTML=`
            <div class="column-header">
                <span class="column-title">${f.name}</span>
                <span id="count-${key}" style="float:right;color:#9ca3af;font-size:11px;">0</span>
            </div>
            <div id="body-${key}"></div>
        `;
        c.appendChild(col);
    });
}

function fetchFeed(feed){
    const proxy = `https://raspy-band-fd14.sedique.workers.dev/?url=${encodeURIComponent(feed.url)}`;
    const key=feed.name.replace(/\s+/g,'');

    fetch(proxy)
        .then(r=>r.json())
        .then(data=>{
            const xml=new DOMParser().parseFromString(data.contents,"text/xml");

            // support RSS <item> and Atom <entry>
            let items=[...xml.querySelectorAll("item")];
            if (items.length === 0) items=[...xml.querySelectorAll("entry")];
            items = items.slice(0,12);

            const body=document.getElementById("body-"+key);
            let count=0;

            items.forEach(i=>{
                const title=sanitize(i.querySelector("title")?.textContent);

                // Atom: <link href="">
                let linkEl = i.querySelector("link");
                let link = linkEl?.getAttribute("href") || linkEl?.textContent || "";

                const desc = sanitize(
                    i.querySelector("description")?.textContent ||
                    i.querySelector("summary")?.textContent ||
                    ""
                );

                const img = extractImage(i);
                if(!title) return;

                const card=document.createElement("div");
                card.className="card";
                card.dataset.source=feed.name;
                card.dataset.searchtext=(title+" "+desc).toLowerCase();
                card.innerHTML=`
                    ${img ? `<img src="${img}" alt="">` : ""}
                    <div class="card-body">
                        <div class="card-title"><a href="${link}" target="_blank">${title}</a></div>
                        <div class="card-desc">${desc}</div>
                    </div>`;
                body.appendChild(card);
                count++;
            });

            document.getElementById("count-"+key).textContent=count;
        })
        .catch(()=>{
            document.getElementById("body-"+key).innerHTML="<p style='color:#888;font-size:13px;'>Feed blocked or unavailable.</p>";
            document.getElementById("count-"+key).textContent="0";
        });
}

document.addEventListener("click",e=>{
    if(e.target.classList.contains("filter")){
        document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
        e.target.classList.add("active");
        const src=e.target.dataset.source;
        document.querySelectorAll(".column").forEach(col=>{
            col.style.display=(src==="all"||col.dataset.source===src)?"":"none";
        });
    }
});

document.getElementById("searchBar").addEventListener("input",function(){
    const q=this.value.toLowerCase();
    document.querySelectorAll(".card").forEach(card=>{
        card.style.display=card.dataset.searchtext.includes(q)?"":"none";
    });
});

initColumns();
feeds.forEach(fetchFeed);
</script>

</body>
</html>
